name: driveguard
description: "Cross-platform SSD/HDD temperature monitor for Windows, macOS and Linux."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  window_manager: ^0.4.3
  tray_manager: ^0.5.0
  desktop_multi_window: ^0.3.1
  local_notifier: ^0.1.6
  launch_at_startup: ^0.5.1
  fl_chart: ^0.69.2
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 800

flutter_launcher_icons:
  image_path: "assets/images/app_logo.png"
  windows:
    generate: true
    image_path: "assets/images/app_logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/app_logo.png"
  linux:
    generate: true
    image_path: "assets/images/app_logo.png"
