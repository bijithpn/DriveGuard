name: Release

# Run by pushing a tag like v1.0.0. Signing steps run only when the matching
# repository secrets exist; otherwise unsigned artifacts are still produced.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libnotify-dev libsqlite3-dev
      - run: flutter pub get
      - run: flutter build linux --release --obfuscate --split-debug-info=build/symbols
      - run: tar -czf driveguard-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            driveguard-linux-x64.tar.gz
            build/symbols

  macos:
    runs-on: macos-latest
    env:
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build macos --release --obfuscate --split-debug-info=build/symbols
      - name: Sign and notarize
        if: env.HAVE_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --deep --force --options runtime --sign "$SIGN_IDENTITY" "$APP"
          ditto -c -k --keepParent "$APP" DriveGuard-notarize.zip
          xcrun notarytool submit DriveGuard-notarize.zip \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$APP"
      - name: Package
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          ditto -c -k --keepParent "$APP" driveguard-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            driveguard-macos.zip
            build/symbols

  windows:
    runs-on: windows-latest
    env:
      HAVE_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build windows --release --obfuscate --split-debug-info=build/symbols
      - name: Sign executable
        if: env.HAVE_CERT == 'true'
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          Get-ChildItem build\windows\x64\runner\Release\*.exe | ForEach-Object {
            & $signtool sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
      - shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath driveguard-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            driveguard-windows-x64.zip
            build/symbols

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux/driveguard-linux-x64.tar.gz
            dist/macos/driveguard-macos.zip
            dist/windows/driveguard-windows-x64.zip
